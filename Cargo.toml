[package]
name = "server-info"
version = "0.1.0"
edition = "2021"
rust-version = "1.70"
description = "Dependency-free server information viewer (CPU, memory, storage, RAID, network)"
license = "MIT"
readme = "README.md"
repository = "https://github.com/megumisodotcom/server-info"
keywords = ["server", "monitoring", "system-information", "cli"]
categories = ["command-line-utilities"]

[[bin]]
name = "server-info"
path = "src/main.rs"

[dependencies]

[profile.release]
lto = true
codegen-units = 1
strip = true
